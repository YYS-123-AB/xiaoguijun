<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="大学专业介绍站 - 覆盖13大学科门类260+专业详细信息，就业前景、薪资行情、考研方向、院校推荐一站式查询">
  <title>大学专业介绍站 - 高考志愿填报参考系统</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://pl31304117.profitableratecpmnetwork.com/c4/e3/9f/c4e39f51a5af7bb04de967b5b7791101.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo-area">
        <h1 class="logo">🎓 大学专业介绍站</h1>
        <p class="tagline">专业信息一站式查询 · 高考志愿填报好帮手</p>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="切换主题">
          <span class="theme-icon-light">☀️</span>
          <span class="theme-icon-dark">🌙</span>
        </button>
        <button class="favorites-btn" id="favoritesBtn" title="我的收藏">
          ❤️ 收藏夹 <span class="fav-count" id="favCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="search-section">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索专业名、专业代码、院校、课程名、就业方向关键词...">
        <button class="search-btn" id="searchBtn">搜索</button>
      </div>
      <div class="search-tips" id="searchTips">
        热门搜索：<span class="tag hot-tag">计算机</span><span class="tag hot-tag">临床医学</span><span class="tag hot-tag">金融学</span><span class="tag hot-tag">法学</span>
      </div>
    </section>

    <section class="filters-section">
      <div class="filter-group">
        <div class="filter-label">学科门类：</div>
        <div class="filter-tabs" id="categoryTabs">
          <button class="tab-btn active" data-category="all">全部</button>
          <button class="tab-btn" data-category="哲">哲学</button>
          <button class="tab-btn" data-category="经">经济学</button>
          <button class="tab-btn" data-category="法">法学</button>
          <button class="tab-btn" data-category="教">教育学</button>
          <button class="tab-btn" data-category="文">文学</button>
          <button class="tab-btn" data-category="史">历史学</button>
          <button class="tab-btn" data-category="理">理学</button>
          <button class="tab-btn" data-category="工">工学</button>
          <button class="tab-btn" data-category="农">农学</button>
          <button class="tab-btn" data-category="医">医学</button>
          <button class="tab-btn" data-category="管">管理学</button>
          <button class="tab-btn" data-category="艺">艺术学</button>
          <button class="tab-btn" data-category="军">军事学</button>
        </div>
      </div>

      <div class="filter-row">
        <div class="filter-group">
          <div class="filter-label">专业层次：</div>
          <div class="filter-tabs" id="levelTabs">
            <button class="tab-btn small active" data-level="all">全部</button>
            <button class="tab-btn small" data-level="学士">本科专业</button>
            <button class="tab-btn small" data-level="associate">专科专业</button>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-label">就业热度：</div>
          <div class="filter-tabs" id="heatTabs">
            <button class="tab-btn small active" data-heat="all">全部</button>
            <button class="tab-btn small" data-heat="热门">🔥 热门</button>
            <button class="tab-btn small" data-heat="冷门">❄️ 冷门</button>
            <button class="tab-btn small" data-heat="国家特色">⭐ 国家特色</button>
            <button class="tab-btn small" data-heat="新增">🆕 新增</button>
          </div>
        </div>

        <div class="filter-group sort-group">
          <div class="filter-label">排序：</div>
          <select id="sortSelect" class="sort-select">
            <option value="default">默认排序</option>
            <option value="popularity-desc">人气从高到低</option>
            <option value="popularity-asc">人气从低到高</option>
            <option value="employment-desc">就业率从高到低</option>
            <option value="employment-asc">就业率从低到高</option>
            <option value="salary-desc">薪资从高到低</option>
            <option value="salary-asc">薪资从低到高</option>
          </select>
        </div>
      </div>
    </section>

    <section class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">共找到</span>
        <span class="stat-value" id="totalCount">0</span>
        <span class="stat-label">个专业</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">本科</span>
        <span class="stat-value" id="bachelorCount">0</span>
        <span class="stat-label">个</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">专科</span>
        <span class="stat-value" id="associateCount">0</span>
        <span class="stat-label">个</span>
      </div>
    </section>

    <section class="majors-section">
      <div class="loading-state" id="loadingState">
        <div class="loader"></div>
        <p>正在加载专业数据...</p>
      </div>

      <div class="error-state hidden" id="errorState">
        <div class="error-icon">⚠️</div>
        <h3>数据加载失败</h3>
        <p>请检查网络连接后刷新页面</p>
        <button class="btn-primary" id="retryBtn">重新加载</button>
      </div>

      <div class="empty-state hidden" id="emptyState">
        <div class="empty-icon">🔍</div>
        <h3>未找到匹配的专业</h3>
        <p>请尝试调整筛选条件或搜索关键词</p>
        <button class="btn-primary" id="resetFiltersBtn">重置筛选条件</button>
      </div>

      <div class="majors-grid" id="majorsGrid"></div>
    </section>
  </main>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      <div class="modal-content" id="modalContent">
        <div class="modal-loading" id="modalLoading">
          <div class="loader"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="back-to-top hidden" id="backToTop" title="回到顶部">
    ⬆️
  </button>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2024 大学专业介绍站 · 数据仅供参考，以官方公布为准</p>
      <p class="footer-links">
        <a href="javascript:;" id="aboutLink">关于我们</a> · 
        <a href="javascript:;" id="contactLink">联系反馈</a> · 
        <a href="javascript:;" id="disclaimerLink">免责声明</a>
      </p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="https://pl31304118.profitableratecpmnetwork.com/a4/75/3f/a4753f25d90100d6516f6bad77f3c7a8.js"></script>
</body>
</html>
